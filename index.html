<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrainGuard">
  <meta name="description" content="Never board the wrong train. Turns your IRCTC SMS into a clear pass, warns you about look-alike trains and works offline.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>TrainGuard</title>
  <link rel="stylesheet" href="./src/app.css">
</head>
<body>
  <div class="app" id="app" data-theme="dark">
    <div class="wall" aria-hidden="true"></div>
    <main id="views">
      <section class="view" id="view-pass" role="tabpanel" aria-labelledby="tab-pass"></section>
      <section class="view" id="view-journey" role="tabpanel" aria-labelledby="tab-journey"></section>
      <section class="view" id="view-safety" role="tabpanel" aria-labelledby="tab-safety"></section>
    </main>
    <div class="edge top" aria-hidden="true"></div>
    <div class="edge bottom" aria-hidden="true"></div>
    <div class="topbar" id="topbar"></div>
    <div class="dock" id="dock"></div>
    <div id="sheetHost"></div>
    <div id="bigHost"></div>
    <div id="toastHost" aria-live="polite"></div>
  </div>
  <script src="./src/parser.js"></script>
  <script src="./src/timetable.js"></script>
  <script src="./src/i18n.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
