name: Build Android app

on:
  push:
    branches: [ main, 'ios/**', 'android/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web bundle and sync Capacitor
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          sh ../scripts/ci_retry.sh ./gradlew --version --no-daemon
          ./gradlew assembleDebug --no-daemon > build.log 2>&1 || {
            grep -E -A4 "error:|What went wrong|Exception in thread" build.log | head -n 30 | sed 's/^/::error::/'
            tail -n 20 build.log
            exit 1
          }

      - name: Rename APK
        run: |
          test -f android/app/src/main/assets/public/data/timetable.json || { echo "::error::The timetable is missing from the app"; exit 1; }
          cp android/app/build/outputs/apk/debug/app-debug.apk TrainGuard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainGuard-Android-APK
          path: TrainGuard.apk
          if-no-files-found: error

  emulator:
    # A real Android emulator, to confirm the app starts and draws its screens.
    # It doesn't decide whether the APK is good, and it has a time limit, because a dead emulator makes adb wait forever.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build with a sample trip
        run: |
          npm ci
          npm run build
          npx cap sync android
          node scripts/ci_seed_simulator.js android/app/src/main/assets/public/index.html
          chmod +x android/gradlew
          cd android
          sh ../scripts/ci_retry.sh ./gradlew --version --no-daemon
          ./gradlew assembleDebug --no-daemon --quiet

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: sh scripts/ci_android_screens.sh

      - name: Check the screens aren't blank
        run: |
          pip3 install --quiet pillow
          python3 scripts/ci_check_screens.py shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Emulator-Screenshots
          path: shots
