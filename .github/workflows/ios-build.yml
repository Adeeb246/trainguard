name: Build iOS Native App & Dynamic Island

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Build web bundle & Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios
          node -e 'const fs = require("fs"); const p = "./ios/App/App/capacitor.config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); if (!c.packageClassList.includes("LiveActivityPlugin")) c.packageClassList.push("LiveActivityPlugin"); fs.writeFileSync(p, JSON.stringify(c, null, 2));'

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Configure TrainGuardWidgets Target with Xcodeproj
        run: |
          gem install xcodeproj --no-document
          ruby scripts/setup_widget_extension.rb

      - name: Build iOS App and Widgets for Physical iPhone
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -target TrainGuardWidgets \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build || true

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA for Sideloadly / AltStore
        working-directory: ios/App
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          if [ -d "build/Release-iphoneos/TrainGuardWidgets.appex" ]; then
            mkdir -p build/Payload/App.app/PlugIns
            cp -r build/Release-iphoneos/TrainGuardWidgets.appex build/Payload/App.app/PlugIns/
          fi
          cd build
          zip -r TrainGuard.ipa Payload
          cd ..

      - name: Upload TrainGuard IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainGuard-iOS-Package
          path: ios/App/build/TrainGuard.ipa
          if-no-files-found: error
