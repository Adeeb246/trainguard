name: Build iOS app

on:
  push:
    branches: [ main, 'ios/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle and sync Capacitor
        run: |
          npm run build
          npx cap sync ios
          node -e 'const fs = require("fs"); const p = "./ios/App/App/capacitor.config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); if (!c.packageClassList.includes("LiveActivityPlugin")) c.packageClassList.push("LiveActivityPlugin"); fs.writeFileSync(p, JSON.stringify(c, null, 2));'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Configure the widget target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/setup_widget_extension.rb

      - name: Build for iPhone
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS' -configuration Release \
            SYMROOT="$(pwd)/build" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u | head -n 30 | sed 's/^/::error::/'
              tail -n 20 build.log
              exit 1
            }

      - name: Package unsigned IPA for Sideloadly and AltStore
        working-directory: ios/App
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          mkdir -p build/Payload/App.app/PlugIns
          cp -r build/Release-iphoneos/TrainGuardWidgets.appex build/Payload/App.app/PlugIns/
          test -f build/Payload/App.app/PlugIns/TrainGuardWidgets.appex/TrainGuardWidgets || { echo "::error::The widget extension is missing from the IPA"; exit 1; }
          test -f build/Payload/App.app/public/data/timetable.json || { echo "::error::The timetable is missing from the IPA"; exit 1; }
          cd build
          zip -qr TrainGuard.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrainGuard-iOS-Package
          path: ios/App/build/TrainGuard.ipa
          if-no-files-found: error

  simulator:
    # A real iOS Simulator, the only way to see the native app without a Mac.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build and sync with a sample trip
        run: |
          npm ci
          npm run build
          npx cap sync ios
          node -e 'const fs = require("fs"); const p = "./ios/App/App/capacitor.config.json"; const c = JSON.parse(fs.readFileSync(p, "utf8")); if (!c.packageClassList.includes("LiveActivityPlugin")) c.packageClassList.push("LiveActivityPlugin"); fs.writeFileSync(p, JSON.stringify(c, null, 2));'
          node scripts/ci_seed_simulator.js ios/App/App/public/index.html
          gem install xcodeproj --no-document
          ruby scripts/setup_widget_extension.rb

      - name: Build, install and screenshot
        working-directory: ios/App
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination "id=$DEVICE" \
            SYMROOT="$PWD/sim" CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || {
              grep -E "error:" sim.log | sort -u | head -n 30 | sed 's/^/::error::/'
              exit 1
            }
          xcrun simctl install "$DEVICE" sim/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.trainguard.app
          mkdir -p shots
          sleep 30; xcrun simctl io "$DEVICE" screenshot shots/1-pass.png
          sleep 40; xcrun simctl io "$DEVICE" screenshot shots/2-journey.png
          sleep 40; xcrun simctl io "$DEVICE" screenshot shots/3-safety.png
          # Leave the app, because the Dynamic Island doesn't show an app's own Live Activity while it's open.
          xcrun simctl launch "$DEVICE" com.apple.Preferences
          sleep 10; xcrun simctl io "$DEVICE" screenshot shots/4-island.png

      - name: Check the screens aren't blank
        run: |
          pip3 install --quiet --break-system-packages pillow
          python3 scripts/ci_check_screens.py ios/App/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator-Screenshots
          path: ios/App/shots
